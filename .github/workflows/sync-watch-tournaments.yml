name: Sync Watch Tournaments

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-watch-tournaments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation dependency
        run: npm install --no-save firebase-admin

      - name: Sync watch-only tournaments into Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
        run: node scripts/sync-watch-tournaments.mjs
